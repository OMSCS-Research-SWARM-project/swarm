# Malware Analysis VM Setup Playbook
#
# ARCHITECTURE NOTES:
#   Both x86_64 and ARM64 use the same apt + pip tool installation path.
#   The REMnux installer is NOT used — it is x86-only, Ubuntu-version-locked,
#   and a 60-minute black box. This playbook installs an equivalent curated
#   tool set that works on any Ubuntu version and both architectures.
#
#   All tasks run on both architectures. The is_arm64/is_x86_64 vars are available
#   if arch-specific tasks are needed in the future.
#
# PREREQUISITES (must be done manually on the VM before running this playbook):
#   1. SSH access: confirm you can reach the VM at the IP in inventory.ini
#   2. Passwordless sudo: add the following line to /etc/sudoers via visudo,
#      after the %sudo line:
#        swarm ALL=(ALL) NOPASSWD: ALL
---
- name: Configure Malware Analysis VM (REMnux-equivalent + Ghidra)
  hosts: ghidra_vm
  become: yes
  vars:
    swarm_home: "/home/swarm"
    is_x86_64: "{{ ansible_architecture == 'x86_64' }}"
    is_arm64: "{{ ansible_architecture == 'aarch64' }}"

  tasks:

    # ===== SYSTEM DETECTION =====

    - name: Gather system facts
      setup:

    - name: Display detected environment
      debug:
        msg:
          - "Architecture  : {{ ansible_architecture }}"
          - "Platform      : {{ 'x86_64 (Intel/AMD)' if is_x86_64 else 'ARM64/aarch64 (Apple Silicon / UTM)' }}"
          - "Hypervisor    : {{ ansible_virtualization_type | default('unknown') }}"
          - "OS            : {{ ansible_distribution }} {{ ansible_distribution_version }}"

    # ===== BASE SYSTEM =====

    - name: Stop unattended-upgrades to prevent apt lock conflicts
      systemd:
        name: unattended-upgrades
        state: stopped
        enabled: no

    - name: Wait for any existing apt locks to clear
      shell: |
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
          sleep 2
        done
      changed_when: false
      timeout: 120

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install essential base packages
      apt:
        name:
          - vim
          - curl
          - wget
          - git
          - unzip
          - python3-pip
          - python3-dev
          - ca-certificates
          - gnupg
          - software-properties-common
          - lsb-release
        state: present

    # ===== USER SETUP =====

    - name: Ensure swarm user is in required groups
      user:
        name: swarm
        groups: sudo,audio,video,plugdev,netdev,adm,vboxsf
        append: yes

    - name: Grant swarm passwordless sudo
      lineinfile:
        path: /etc/sudoers
        line: "swarm ALL=(ALL) NOPASSWD: ALL"
        insertafter: "^%sudo"
        validate: /usr/sbin/visudo -cf %s

    - name: Allow Wireshark capture without sudo
      debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        value: "true"
        vtype: boolean

    # ===== SDDM CONFIGURATION =====
    # KDE Plasma is assumed to be pre-installed. These tasks configure
    # SDDM login behavior and theme without reinstalling the desktop.

    - name: Install sddm-theme-breeze
      apt:
        name: sddm-theme-breeze
        state: present

    - name: Ensure SDDM config directory exists
      file:
        path: /etc/sddm.conf.d
        state: directory
        mode: '0755'

    - name: Remove any existing SDDM autologin config
      file:
        path: /etc/sddm.conf.d/autologin.conf
        state: absent

    - name: Configure SDDM login (password required, breeze dark theme)
      copy:
        dest: /etc/sddm.conf.d/kde.conf
        content: |
          [General]
          DefaultSession=plasma

          [Theme]
          Current=breeze

          [Users]
          DefaultUser=swarm
        mode: '0644'
      notify: Restart SDDM

    # ===== ACCESSIBILITY =====

    - name: Install accessibility tools
      apt:
        name:
          - orca
          - speech-dispatcher
          - espeak-ng
        state: present
      ignore_errors: yes

    # ===== VM GUEST TOOLS =====

    - name: Install open-vm-tools (VMware / Fusion)
      apt:
        name:
          - open-vm-tools
          - open-vm-tools-desktop
        state: present

    - name: Install QEMU/SPICE guest tools (KVM/UTM)
      apt:
        name:
          - spice-vdagent
          - qemu-guest-agent
          - spice-webdavd
        state: present
      ignore_errors: yes

    - name: Enable QEMU guest agent
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started
      ignore_errors: yes

    # ===== BOOT SPLASH (Plymouth) =====

    - name: Install Plymouth themes package
      apt:
        name: plymouth-themes
        state: present

    - name: Set dark Plymouth spinner theme
      command: plymouth-set-default-theme -R spinner
      args:
        creates: /etc/alternatives/default.plymouth

    # ===== JAVA (Ghidra dependency) =====

    - name: Install OpenJDK 21
      apt:
        name: openjdk-21-jdk
        state: present

    # ===== GHIDRA =====

    - name: Install snapd
      apt:
        name: snapd
        state: present

    - name: Ensure snapd service is running
      systemd:
        name: snapd
        enabled: yes
        state: started

    - name: Install Ghidra via snap
      snap:
        name: ghidra
        classic: yes
        state: present

    # ===== MALWARE ANALYSIS TOOLS =====

    - name: Install malware analysis apt packages
      tags: core
      apt:
        name:
          # PCAP / network forensics
          - wireshark
          - tshark
          - tcpdump
          - nmap
          - dnsutils
          - whois
          # Binary / static analysis
          - binutils
          - file
          - xxd
          - radare2
          - binwalk
          - upx-ucl
          - yara
          - libimage-exiftool-perl
          - ssdeep
          - nasm
          # Archive tools (malware samples are often zipped)
          - p7zip-full
          - unzip
        state: present

    - name: Add swarm user to wireshark group
      user:
        name: swarm
        groups: wireshark
        append: yes

    # --- Python pip packages (system-wide) ---

    - name: Install Python malware analysis packages
      tags: pip
      pip:
        name:
          # PE / ELF / binary parsing
          - pefile
          - pyelftools
          - lief
          # Disassembly
          - capstone
          - r2pipe
          # Malware-specific utilities
          - xortool
        extra_args: --break-system-packages

    # ===== ANALYSIS WORKSPACE =====

    - name: Create GhidraProjects directory
      file:
        path: "{{ swarm_home }}/GhidraProjects"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Create PCAP analysis directory
      file:
        path: "{{ swarm_home }}/pcaps"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Create malware-analysis workspace
      file:
        path: "{{ swarm_home }}/malware-analysis"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Clone Mirai source code repository
      git:
        repo: 'https://github.com/jgamblin/Mirai-Source-Code.git'
        dest: "{{ swarm_home }}/Mirai-Source-Code"
        version: master
      become_user: swarm

    - name: Write workspace README
      copy:
        dest: "{{ swarm_home }}/malware-analysis/README.txt"
        content: |
          Malware Analysis Workspace
          ==========================
          Architecture : {{ ansible_architecture }}
          Tool Set     : REMnux-like (apt + pip)

          Directories:
            ~/Mirai-Source-Code   - Mirai botnet source
            ~/GhidraProjects       - Ghidra project files
            ~/malware-analysis     - Analysis notes and reports
            ~/pcaps                - PCAP captures for analysis

          Credentials:
            Username: swarm  |  Password: 6262student

          WARNING: This VM contains malware samples for STATIC ANALYSIS ONLY.
            - Do NOT execute any malware binaries
            - Keep VM on host-only / NAT networking
            - Do NOT copy malware outside isolated environments

          Installed Tools:
            Reverse Engineering : Ghidra (snap), radare2, binwalk
            Binary Utilities    : strings, objdump, readelf (binutils), file, xxd, exiftool
            Packed Binaries     : upx  (Mirai is often UPX-packed — run: upx -d <binary>)
            PCAP / Network      : Wireshark, tshark, tcpdump, nmap, dig, whois
            Pattern Matching    : yara, ssdeep
            Python (pip)        : pefile, pyelftools, lief, capstone, r2pipe, xortool

          Quick Commands:
            ghidra              - Launch Ghidra
            r2 <file>           - radare2 binary analysis
            binwalk <file>      - Identify binary formats / sections
            strings <file>      - Extract printable strings (-a flag set by default)
            upx -d <file>       - Decompress UPX-packed binary before loading into Ghidra
            tshark -r <pcap>    - CLI PCAP inspection
            yara <rules> <file> - Scan binary against YARA rules
        owner: swarm
        group: swarm
        mode: '0644'

    # ===== SHELL CONFIGURATION =====

    - name: Configure vim
      copy:
        dest: "{{ swarm_home }}/.vimrc"
        content: |
          set number
          set expandtab
          set tabstop=4
          set shiftwidth=4
          syntax on
          set autoindent
          set hlsearch
        owner: swarm
        group: swarm
        mode: '0644'

    - name: Add analysis aliases to .bashrc
      blockinfile:
        path: "{{ swarm_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Analysis aliases"
        block: |
          alias ll='ls -lah'
          alias mirai='cd ~/Mirai-Source-Code'
          alias workspace='cd ~/malware-analysis'
          alias pcap='cd ~/pcaps'
          alias r2='radare2'
          alias strings='strings -a'
        owner: swarm
        group: swarm

    # ===== PERMISSIONS =====

    - name: Set ownership of swarm home directory
      file:
        path: "{{ swarm_home }}"
        owner: swarm
        group: swarm
        recurse: yes

    - name: Remove stale .Xauthority file
      file:
        path: "{{ swarm_home }}/.Xauthority"
        state: absent

    - name: Ensure KDE config directory exists
      tags: kde
      file:
        path: "{{ swarm_home }}/.config"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Disable KDE screen lock
      tags: kde
      copy:
        dest: "{{ swarm_home }}/.config/kscreenlockerrc"
        content: |
          [Daemon]
          Autolock=false
          LockOnResume=false
          Timeout=0
          [Greeter]
          Theme=org.kde.breeze.desktop
        owner: swarm
        group: swarm
        mode: '0644'

    - name: Disable KDE screensaver
      copy:
        dest: "{{ swarm_home }}/.config/kscreensaverrc"
        content: |
          [ScreenSaver]
          Enabled=false
          Lock=false
          LockGrace=0
          Timeout=0
        owner: swarm
        group: swarm
        mode: '0644'

    - name: Configure KDE window placement (center new windows, no off-screen restore)
      tags: kde
      copy:
        dest: "{{ swarm_home }}/.config/kwinrc"
        content: |
          [Windows]
          Placement=Centered
        owner: swarm
        group: swarm
        mode: '0644'

    # ===== SUMMARY =====

    - name: Display completion summary
      debug:
        msg:
          - "======================================================="
          - " Malware Analysis VM — Setup Complete"
          - "======================================================="
          - " Architecture : {{ ansible_architecture }}"
          - " Platform     : {{ 'x86_64 (Intel/AMD)' if is_x86_64 else 'ARM64 (Apple Silicon / UTM)' }}"
          - " Tool Set     : REMnux-equivalent (apt + pip)"
          - ""
          - " Installed Tools:"
          - "   RE / Static : Ghidra (snap), radare2, binwalk, upx"
          - "   Bin utils   : strings, objdump, readelf, file, xxd, exiftool"
          - "   PCAP        : Wireshark, tshark, tcpdump, nmap, dig, whois"
          - "   Patterns    : yara, ssdeep"
          - "   Python      : pefile, pyelftools, lief, capstone, r2pipe, xortool"
          - ""
          - " VM Credentials : swarm / 6262student"
          - " Desktop        : KDE Plasma (SDDM login required; screen lock disabled)"
          - ""
          - " IMPORTANT: Static analysis only — do NOT execute malware binaries."
          - " Restart the VM for desktop changes to take effect."
          - "======================================================="

  handlers:
    - name: Restart SDDM
      systemd:
        name: sddm
        state: restarted
      ignore_errors: yes