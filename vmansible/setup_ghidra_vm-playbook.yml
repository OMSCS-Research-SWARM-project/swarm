---
- name: Configure Ubuntu 24.04 Malware Analysis VM (REMnux-equivalent + Ghidra)
  hosts: ghidra_vm
  become: yes
  vars:
    swarm_home: "/home/swarm"
    analysis_venv: "/opt/analysis-tools"
    is_x86_64: "{{ ansible_architecture == 'x86_64' }}"
    is_arm64: "{{ ansible_architecture == 'aarch64' }}"

  tasks:

    # ===== SYSTEM DETECTION =====

    - name: Gather system facts
      setup:

    - name: Display detected environment
      debug:
        msg:
          - "Architecture  : {{ ansible_architecture }}"
          - "Platform      : {{ 'x86_64 (Intel/AMD)' if is_x86_64 else 'ARM64/aarch64 (Apple Silicon / UTM)' }}"
          - "Hypervisor    : {{ ansible_virtualization_type | default('unknown') }}"
          - "OS            : {{ ansible_distribution }} {{ ansible_distribution_version }}"

    # ===== BASE SYSTEM =====

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install essential base packages
      apt:
        name:
          - net-tools
          - vim
          - htop
          - curl
          - wget
          - git
          - tree
          - unzip
          - tmux
          - build-essential
          - python3-pip
          - python3-venv
          - python3-dev
          - apt-transport-https
          - ca-certificates
          - gnupg
          - software-properties-common
          - lsb-release
          - dkms
          - linux-headers-generic
        state: present

    # ===== USER SETUP =====

    - name: Ensure swarm user is in required groups
      user:
        name: swarm
        groups: sudo,audio,video,plugdev,netdev,adm,vboxsf
        append: yes

    - name: Allow Wireshark capture without sudo
      debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        value: "true"
        vtype: boolean

    # ===== KDE PLASMA DESKTOP =====

    - name: Remove LightDM if present
      apt:
        name: lightdm
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Install KDE Plasma desktop
      apt:
        name:
          - kde-plasma-desktop
          - sddm
          - sddm-theme-breeze
          - konsole
          - dolphin
          - kate
          - plasma-nm
          - xorg
        state: present

    - name: Set SDDM as default display manager
      debconf:
        name: sddm
        question: shared/default-x-display-manager
        value: sddm
        vtype: select

    - name: Enable SDDM service
      systemd:
        name: sddm
        enabled: yes
        state: started
      ignore_errors: yes

    - name: Ensure SDDM config directory exists
      file:
        path: /etc/sddm.conf.d
        state: directory
        mode: '0755'

    - name: Remove any existing SDDM autologin config
      file:
        path: /etc/sddm.conf.d/autologin.conf
        state: absent

    - name: Configure SDDM login (password required, breeze dark theme)
      copy:
        dest: /etc/sddm.conf.d/kde.conf
        content: |
          [General]
          DefaultSession=plasma

          [Theme]
          Current=breeze

          [Users]
          DefaultUser=swarm
        mode: '0644'
      notify: Restart SDDM

    # ===== ACCESSIBILITY =====

    - name: Install accessibility tools
      apt:
        name:
          - orca
          - speech-dispatcher
          - espeak-ng
        state: present
      ignore_errors: yes

    # ===== VM GUEST TOOLS =====

    - name: Install open-vm-tools (VMware / Fusion)
      apt:
        name:
          - open-vm-tools
          - open-vm-tools-desktop
        state: present

    - name: Install QEMU/SPICE guest tools (ARM/UTM)
      apt:
        name:
          - spice-vdagent
          - qemu-guest-agent
          - spice-webdavd
        state: present
      when: is_arm64
      ignore_errors: yes

    - name: Enable QEMU guest agent (ARM)
      systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started
      when: is_arm64
      ignore_errors: yes

    # ===== BOOT SPLASH (Plymouth) =====

    - name: Install Plymouth themes package
      apt:
        name: plymouth-themes
        state: present

    - name: Set dark Plymouth spinner theme
      command: plymouth-set-default-theme -R spinner
      args:
        creates: /etc/alternatives/default.plymouth

    # ===== JAVA (Ghidra dependency) =====

    - name: Install OpenJDK 21
      apt:
        name: openjdk-21-jdk
        state: present

    # ===== GHIDRA =====

    - name: Install snapd
      apt:
        name: snapd
        state: present

    - name: Ensure snapd service is running
      systemd:
        name: snapd
        enabled: yes
        state: started

    - name: Install Ghidra via snap
      snap:
        name: ghidra
        classic: yes
        state: present

    # ===== REMNUX TOOLS =====
    # x86: run the official REMnux addon installer — installs the full tool suite
    #       (~60 min, idempotent via /etc/remnux-version sentinel)
    # ARM: manually install the ARM-compatible equivalent package set

    # --- x86: REMnux addon installer ---

    - name: Download REMnux installer (x86 only)
      get_url:
        url: "https://REMnux.org/remnux"
        dest: /usr/local/bin/remnux
        mode: '0755'
        checksum: "sha256:15581da24c906126aba2c1e21001311d7a93d9d017c95597c662372248964661"
      when: is_x86_64

    - name: Run REMnux addon installer (x86 only — takes ~60 min)
      command: remnux install --mode=addon
      args:
        creates: /etc/remnux-version
      when: is_x86_64
      async: 7200
      poll: 30

    # --- ARM64: apt packages ---

    - name: Install REMnux-equivalent apt packages (ARM64)
      apt:
        name:
          # Network / PCAP forensics
          - wireshark
          - tshark
          - tcpdump
          - tcpflow
          - nmap
          - dnsutils
          - whois
          - ngrep
          - tor
          # Binary / static analysis
          - binutils
          - file
          - xxd
          - radare2
          - binwalk
          - upx-ucl
          - yara
          - libimage-exiftool-perl
          - bulk-extractor
          - scalpel
          - sleuthkit
          - ltrace
          - strace
          - gdb
          - ssdeep
          - nasm
          # Document / office analysis
          - qpdf
          - pdfresurrect
          - xmlstarlet
          - zbar-tools
          - imagemagick
          - evince
          # Build dependencies required by RE tools
          - autoconf
          - automake
          - flex
          - libboost-dev
          - libboost-python-dev
          - libboost-system-dev
          - libffi-dev
          - libjpeg-dev
          - libjpeg8-dev
          - liblzma-dev
          - libsqlite3-dev
          - libssl-dev
          - libtool
          - libxml2-dev
          - libxslt1-dev
          - libgraphviz-dev
          - libfuzzy-dev
          - graphviz
          - zlib1g-dev
          # Java-based tools
          - default-jre
          - libjavassist-java
          # Archive / encoding utilities
          - cabextract
          - dos2unix
          - p7zip-full
          - unrar
          - rar
          - sharutils
          - jq
          # Version control
          - mercurial
          - subversion
          # Scripting runtimes
          - ruby
          - ruby-dev
          - bundler
          - nodejs
          # Python system packages
          - python3-magic
          - python3-pyasn1
          - python3-dnspython
          - python3-numpy
          - python3-pil
          - python3-requests
          - python3-cryptography
          - python3-ssdeep
          - python3-tk
          - python3-pyqt5
          # Perl analysis libs
          - libemail-outlook-message-perl
          # AV / detection
          - clamav-daemon
          # Office / document formats
          - msitools
          - sqlite3
          # Misc network
          - netcat-openbsd
        state: present
      when: is_arm64

    - name: Add swarm user to wireshark group (ARM64)
      user:
        name: swarm
        groups: wireshark
        append: yes
      when: is_arm64

    # --- ARM64: Python venv and pip packages ---

    - name: Create Python analysis venv (ARM64)
      command: python3 -m venv {{ analysis_venv }}
      args:
        creates: "{{ analysis_venv }}/bin/python"
      when: is_arm64

    - name: Upgrade pip in analysis venv (ARM64)
      pip:
        name: pip
        state: latest
        virtualenv: "{{ analysis_venv }}"
      when: is_arm64

    - name: Install Python malware analysis packages (ARM64)
      pip:
        name:
          # Core RE / PE analysis
          - pefile
          - peframe
          - pyelftools
          - lief
          - dnfile
          - dotnetfile
          # Disassembly / emulation
          - capstone
          - r2pipe
          # PCAP / network
          - scapy
          - mitmproxy
          - fakenet-ng
          # Office / document analysis
          - oletools
          - olefile
          - msoffcrypto-tool
          - pcodedmp
          - xlmmacrodeobfuscator
          - peepdf-3
          - hachoir
          # Android / mobile
          - androguard
          - apkid
          - droidlysis
          # Python bytecode
          - uncompyle6
          # YARA / pattern matching
          - yara-python
          - balbuzard
          # Memory forensics
          - volatility3
          - vivisect
          # Threat intel / IOC
          - ioc-parser
          - ipwhois
          - unfurl
          - name-that-hash
          # Deobfuscation / analysis
          - jsbeautifier
          - xortool
          - chepy
          - malwoverview
          - debloat
          - magika
          - thefuzz
          # Misc utilities
          - python-debian
          - distro-info
          - mail-parser
          - msg-extractor
          - dissect
          - pyinstxtractor-ng
        virtualenv: "{{ analysis_venv }}"
      when: is_arm64

    - name: Add analysis venv to swarm PATH (ARM64)
      blockinfile:
        path: "{{ swarm_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Analysis venv PATH"
        block: |
          export PATH="{{ analysis_venv }}/bin:$PATH"
          export VIRTUAL_ENV="{{ analysis_venv }}"
        owner: swarm
        group: swarm
      when: is_arm64

    # ===== ANALYSIS WORKSPACE =====

    - name: Create GhidraProjects directory
      file:
        path: "{{ swarm_home }}/GhidraProjects"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Create PCAP analysis directory
      file:
        path: "{{ swarm_home }}/pcaps"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Create malware-analysis workspace
      file:
        path: "{{ swarm_home }}/malware-analysis"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Clone Mirai source code repository
      git:
        repo: 'https://github.com/jgamblin/Mirai-Source-Code.git'
        dest: "{{ swarm_home }}/Mirai-Source-Code"
        version: master
      become_user: swarm

    - name: Write workspace README
      copy:
        dest: "{{ swarm_home }}/malware-analysis/README.txt"
        content: |
          Malware Analysis Workspace
          ==========================
          Architecture : {{ ansible_architecture }}
          Tool Set     : {{ 'REMnux (full addon install)' if is_x86_64 else 'REMnux-equivalent (ARM64 package set)' }}

          Directories:
            ~/Mirai-Source-Code   - Mirai botnet source
            ~/GhidraProjects       - Ghidra project files
            ~/malware-analysis     - Analysis notes and reports
            ~/pcaps                - PCAP captures for analysis

          Credentials:
            Username: swarm  |  Password: 6262student

          WARNING: This VM contains malware samples for STATIC ANALYSIS ONLY.
            - Do NOT execute any malware binaries
            - Keep VM on host-only / NAT networking
            - Do NOT copy malware outside isolated environments

          Installed Tools:
            Reverse Engineering : Ghidra (snap), radare2, binwalk
            Binary Utilities    : strings, objdump, readelf (binutils), file, xxd, exiftool
            Packed Binaries     : upx  (Mirai is often UPX-packed — run: upx -d <binary>)
            PCAP Forensics      : Wireshark, tshark, tcpdump
            Network / IoC       : nmap, dig (dnsutils), whois
            Pattern Matching    : yara
            Python              : pefile, oletools, volatility3, capstone, scapy + more
            x86 only            : Full REMnux addon suite (wine, shellcode tools, etc.)

          Quick Commands:
            ghidra              - Launch Ghidra
            r2 <file>           - radare2 binary analysis
            binwalk <file>      - Identify binary formats / sections
            strings <file>      - Extract printable strings (-a flag set by default)
            upx -d <file>       - Decompress UPX-packed binary before loading into Ghidra
            tshark -r <pcap>    - CLI PCAP inspection
            yara <rules> <file> - Scan binary against YARA rules
        owner: swarm
        group: swarm
        mode: '0644'

    # ===== SHELL CONFIGURATION =====

    - name: Configure vim
      copy:
        dest: "{{ swarm_home }}/.vimrc"
        content: |
          set number
          set expandtab
          set tabstop=4
          set shiftwidth=4
          syntax on
          set autoindent
          set hlsearch
        owner: swarm
        group: swarm
        mode: '0644'

    - name: Add analysis aliases to .bashrc
      blockinfile:
        path: "{{ swarm_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Analysis aliases"
        block: |
          alias ll='ls -lah'
          alias mirai='cd ~/Mirai-Source-Code'
          alias workspace='cd ~/malware-analysis'
          alias pcap='cd ~/pcaps'
          alias r2='radare2'
          alias strings='strings -a'
        owner: swarm
        group: swarm

    # ===== PERMISSIONS =====

    - name: Set ownership of swarm home directory
      file:
        path: "{{ swarm_home }}"
        owner: swarm
        group: swarm
        recurse: yes

    - name: Remove stale .Xauthority file
      file:
        path: "{{ swarm_home }}/.Xauthority"
        state: absent

    - name: Ensure KDE config directory exists
      file:
        path: "{{ swarm_home }}/.config"
        state: directory
        owner: swarm
        group: swarm
        mode: '0755'

    - name: Disable KDE screen lock password (wake returns directly to desktop)
      copy:
        dest: "{{ swarm_home }}/.config/kscreenlockerrc"
        content: |
          [Daemon]
          Autolock=false
          LockOnResume=false
        owner: swarm
        group: swarm
        mode: '0644'

    # ===== SUMMARY =====

    - name: Display completion summary
      debug:
        msg:
          - "======================================================="
          - " Malware Analysis VM — Setup Complete"
          - "======================================================="
          - " Architecture : {{ ansible_architecture }}"
          - " Platform     : {{ 'x86_64 (Intel/AMD)' if is_x86_64 else 'ARM64 (Apple Silicon / UTM)' }}"
          - " Tool Set     : {{ 'REMnux addon (full)' if is_x86_64 else 'REMnux-equivalent (ARM64)' }}"
          - ""
          - " Installed Tools:"
          - "   RE / Static : Ghidra (snap), radare2, binwalk, upx"
          - "   Bin utils   : strings, objdump, readelf, file, xxd, exiftool"
          - "   PCAP        : Wireshark, tshark, tcpdump"
          - "   Network/IoC : nmap, dig, whois"
          - "   Patterns    : yara"
          - "   Python      : pefile, oletools, volatility3, capstone, scapy + more"
          - "   x86 only    : Full REMnux addon suite"
          - ""
          - " VM Credentials : swarm / 6262student"
          - " Desktop        : KDE Plasma (SDDM login required; screen lock disabled)"
          - ""
          - " IMPORTANT: Static analysis only — do NOT execute malware binaries."
          - " Restart the VM for desktop changes to take effect."
          - "======================================================="

  handlers:
    - name: Restart SDDM
      systemd:
        name: sddm
        state: restarted
      ignore_errors: yes